<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我想听一句今天能做的话</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      background: #f3f5f8;
      color: #1c2430;
      font: 16px/1.55 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    .side {
      width: 240px;
      flex: none;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #e6eaf0;
    }
    .new {
      margin: 0.85rem 0.75rem 0.45rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid #e1e6ee;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .new:hover { background: #f6f8fb; }
    .chats {
      flex: 1;
      overflow-y: auto;
      padding: 0.2rem 0.45rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 36, 48, 0.22) transparent;
    }
    .chats::-webkit-scrollbar, .thread::-webkit-scrollbar { width: 8px; }
    .chats::-webkit-scrollbar-track, .thread::-webkit-scrollbar-track { background: transparent; }
    .chats::-webkit-scrollbar-thumb, .thread::-webkit-scrollbar-thumb {
      background: rgba(28, 36, 48, 0.18);
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }
    .chats button {
      display: block;
      width: 100%;
      margin: 0.15rem 0;
      padding: 0.55rem 0.65rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .chats button:hover { background: #f4f6f9; }
    .chats button.active { background: #e8edf4; }
    .app {
      flex: 1;
      min-width: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header { padding: 1.1rem 1.15rem 0.35rem; }
    .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }
    header p { margin: 0.25rem 0 0; color: #5c6778; font-size: 0.92rem; }
    .compile {
      flex: none;
      margin-top: 0.15rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid #d5dbe4;
      border-radius: 999px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .compile:hover { background: #f6f8fb; }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      background: rgba(28, 36, 48, 0.28);
    }
    .sheet[hidden] { display: none; }
    .sheet-card {
      width: min(960px, 100%);
      max-height: min(86dvh, 820px);
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(28, 36, 48, 0.18);
    }
    .sheet-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid #e6eaf0;
    }
    .sheet-bar strong { margin-right: auto; font-size: 0.95rem; }
    .sheet-bar button, .sheet-close {
      border: 0;
      border-radius: 999px;
      background: #f3f5f8;
      color: inherit;
      font: inherit;
      font-size: 0.84rem;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
    }
    .sheet-card.showing-map { width: min(1100px, calc(100vw - 1.6rem)); }
    .sheet-bar button[aria-pressed="true"] { background: #1c2430; color: #fff; }
    .sheet-body { overflow: auto; padding: 1rem 1.15rem 1.2rem; }
    .sheet-body h2 { margin: 0 0 0.35rem; font-size: 1.05rem; }
    .sheet-body h3 { margin: 1rem 0 0.35rem; font-size: 0.92rem; }
    .sheet-body p, .sheet-body li { white-space: pre-wrap; }
    .sheet-body ol { margin: 0.2rem 0 0; padding-left: 1.2rem; }
    .sheet-body li { margin: 0.45rem 0; }
    .sheet-body .how { display: block; margin-top: 0.15rem; color: #3d4858; }
    .sheet-body .source { display: block; margin-top: 0.2rem; color: #5c6b7e; font-size: 0.8rem; }
    .sheet-body .notice { margin-top: 1.1rem; color: #5c6b7e; font-size: 0.8rem; }
    .mind-svg { display: block; width: 100%; height: auto; }
    .mind-fit {
      display: flex;
      justify-content: center;
      width: 100%;
      overflow: hidden;
    }
    .mind {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5.5rem;
      width: max-content;
      min-height: 360px;
      margin: 0 auto;
      padding: 1.6rem 1.4rem 2rem;
    }
    .mind-lines {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .mind-side { display: flex; flex-direction: column; justify-content: center; gap: 1.6rem; flex: none; z-index: 1; }
    .mind-arm { display: flex; align-items: center; gap: 3.2rem; flex: none; }
    .mind-leaves { display: flex; flex-direction: column; gap: 0.7rem; flex: none; }
    .mind-side.left .mind-leaves { align-items: flex-end; }
    .mind-side.right .mind-leaves { align-items: flex-start; }
    .mind-node, .mind-root, .leaf {
      position: relative;
      z-index: 1;
      flex: none;
      background: #fff;
      border: 1.5px solid #d5dbe3;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.04);
      line-height: 1.45;
    }
    .mind-node, .leaf { padding: 0.4rem 0.75rem; max-width: 16rem; }
    .mind-root {
      max-width: 11rem;
      padding: 0.7rem 0.9rem;
      border-width: 2px;
      border-color: #1c2430;
      border-radius: 14px;
      font-weight: 650;
      text-align: center;
    }
    .leaf { font-size: 0.86rem; }
    .menu {
      position: fixed;
      z-index: 20;
      min-width: 8.5rem;
      padding: 0.3rem;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(28, 36, 48, 0.16);
    }
    .menu[hidden] { display: none; }
    .menu button {
      display: block;
      width: 100%;
      padding: 0.45rem 0.65rem;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .menu button:hover { background: #f3f5f8; }
    .menu button.danger { color: #9a3412; }
    .chats input {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: inherit;
      font: inherit;
      padding: 0.15rem 0.3rem;
    }
    .chat-name, .chat-note {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chat-note { margin-top: 0.12rem; color: #5c6778; font-size: 0.78rem; }
    .thread {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0.6rem 0.7rem 0.4rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 36, 48, 0.22) transparent;
    }
    .empty {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.45rem;
      padding-bottom: 0.4rem;
    }
    .empty p { margin: 0 0 0.2rem; color: #5c6778; }
    .empty button, .composer button, .new { font: inherit; cursor: pointer; }
    .empty button {
      align-self: flex-start;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #1c2430;
      padding: 0.45rem 0.8rem;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.06);
    }
    .msg { display: flex; margin: 1.05rem 0; }
    .msg.mine { justify-content: flex-end; }
    .msg p {
      margin: 0;
      max-width: 82%;
      padding: 0.65rem 0.8rem;
      border-radius: 16px;
      white-space: pre-wrap;
    }
    .msg.mine p { background: #1c2430; color: #fff; border-bottom-right-radius: 5px; }
    .msg.reply p { background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(28, 36, 48, 0.05); }
    .composer {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      padding: 0.55rem 0.85rem 0.9rem;
    }
    textarea {
      flex: 1;
      margin: 0;
      min-height: 2.75rem;
      max-height: 7.5rem;
      padding: 0.7rem 0.85rem;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      font: inherit;
      resize: none;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.06);
    }
    textarea:focus { outline: 2px solid #1c2430; outline-offset: 0; }
    .composer button {
      height: 2.75rem;
      padding: 0 0.95rem;
      border: 0;
      border-radius: 999px;
      background: #1c2430;
      color: #fff;
    }
    .composer button:disabled { background: #8b95a3; cursor: progress; }
    .caret {
      display: inline-block;
      width: 0.45em;
      height: 0.95em;
      margin-left: 0.08em;
      background: #1c2430;
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <aside class="side">
    <button class="new" type="button" id="new-chat">新对话</button>
    <div class="chats" id="chats"></div>
  </aside>
  <div class="app">
    <header>
      <div class="head-row">
        <div>
          <h1>我想听一句今天能做的话</h1>
          <p>我说卡在哪，你接着告诉我今天能做什么。</p>
        </div>
        <button type="button" id="compile" class="compile" hidden>整理</button>
      </div>
    </header>
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <p>我可以这样开口</p>
        <button type="button" data-fill="我不知道从哪开始，只想重新动一下。今天大概有半小时。">我不知道从哪开始</button>
        <button type="button" data-fill="我只想练英语听力。今天有四十分钟。">我只想练听力</button>
        <button type="button" data-fill="我今天只有几分钟，想要一个很短的动作。">我今天很短</button>
        <button type="button" data-fill="我有一个想法，但还没有人用。今天有四十分钟。">我有想法，还没人用</button>
      </div>
    </div>
    <form class="composer" id="ask" method="get" action="/">
      <textarea id="text" rows="1" placeholder="接着说，或换一件卡着的事"></textarea>
      <button type="button" class="send">发送</button>
    </form>
    <!-- result -->
  </div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-label="整理这段对话">
      <div class="sheet-bar">
        <strong>这段对话</strong>
        <button type="button" data-view="doc" aria-pressed="true">计划文档</button>
        <button type="button" data-view="map" aria-pressed="false">思维导图</button>
        <button type="button" class="sheet-close" id="sheet-close">关闭</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div id="menu" class="menu" hidden>
    <button type="button" data-act="rename">重命名</button>
    <button type="button" data-act="note">写备注</button>
    <button type="button" class="danger" data-act="delete">删除</button>
  </div>
  <script>
    const thread = document.querySelector("#thread");
    const chats = document.querySelector("#chats");
    const starter = document.querySelector("#empty");
    const box = document.querySelector("#text");
    const send = document.querySelector(".send");
    const form = document.querySelector("#ask");
    const menu = document.querySelector("#menu");
    const menuHome = menu.innerHTML;
    const compile = document.querySelector("#compile");
    const sheet = document.querySelector("#sheet");
    const sheetBody = document.querySelector("#sheet-body");
    let brief = null;
    let briefView = "doc";
    const origin = location.protocol === "file:" ? "http://127.0.0.1:8765" : "";
    const openKey = "planner-open";
    let turns = [];
    let currentId = localStorage.getItem(openKey) || "";
    let currentTitle = "";
    let currentNote = "";

    document.querySelector("#new-chat").addEventListener("click", () => beginNew());
    compile.addEventListener("click", () => openBrief());
    document.querySelector("#sheet-close").addEventListener("click", () => closeSheet());
    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) closeSheet();
    });
    sheet.querySelector(".sheet-bar").addEventListener("click", (event) => {
      const view = event.target.getAttribute("data-view");
      if (!view || !brief) return;
      briefView = view;
      sheet.querySelectorAll("[data-view]").forEach((button) => {
        button.setAttribute("aria-pressed", button.getAttribute("data-view") === view ? "true" : "false");
      });
      drawBrief();
    });
    form.addEventListener("submit", (event) => event.preventDefault());
    send.addEventListener("click", () => sendText(box.value));
    box.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendText(box.value);
      }
    });
    box.addEventListener("input", () => {
      box.style.height = "auto";
      box.style.height = Math.min(box.scrollHeight, 120) + "px";
    });
    bindStarters(starter);
    menu.addEventListener("click", (event) => {
      event.stopPropagation();
      const act = event.target.getAttribute("data-act");
      const id = menu.dataset.id;
      if (!act || !id) return;
      if (act === "delete") {
        menu.innerHTML = '<button type="button" class="danger" data-act="confirm-delete">删掉这段</button><button type="button" data-act="cancel-delete">取消</button>';
        return;
      }
      if (act === "cancel-delete") {
        hideMenu();
        return;
      }
      if (act === "confirm-delete") {
        hideMenu();
        removeChat(id);
        return;
      }
      hideMenu();
      editChat(id, act);
    });
    document.addEventListener("click", () => hideMenu());
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!sheet.hidden) closeSheet();
      hideMenu();
    });
    window.addEventListener("scroll", () => hideMenu(), true);
    loadChats();

    function bindStarters(root) {
      root.querySelectorAll("[data-fill]").forEach((button) => {
        button.addEventListener("click", () => sendText(button.getAttribute("data-fill")));
      });
    }

    function sendText(raw) {
      const text = (raw || "").trim();
      if (!text || send.disabled) return;
      box.value = "";
      box.style.height = "auto";
      ask(text);
    }

    function beginNew() {
      if (send.disabled) return;
      currentId = "";
      localStorage.removeItem(openKey);
      turns = [];
      currentTitle = "";
      currentNote = "";
      showStarter();
      drawChats(window.__chats || []);
      syncCompile();
      box.focus();
    }

    async function loadChats() {
      try {
        const response = await fetch(origin + "/chats");
        const list = response.ok ? await response.json() : [];
        window.__chats = list;
        drawChats(list);
        if (currentId && list.some((item) => item.id === currentId)) openChat(currentId);
        else beginNew();
      } catch (error) {
        beginNew();
      }
    }

    function drawChats(list) {
      chats.replaceChildren();
      list.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        const name = document.createElement("span");
        name.className = "chat-name";
        name.textContent = item.title || "新的对话";
        button.append(name);
        button.dataset.id = item.id;
        if (item.note) {
          const remark = document.createElement("span");
          remark.className = "chat-note";
          remark.textContent = item.note;
          button.append(remark);
        }
        if (item.id === currentId) button.className = "active";
        button.addEventListener("click", () => openChat(item.id));
        button.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          openMenu(event.clientX, event.clientY, item.id);
        });
        chats.append(button);
      });
    }

    async function openChat(id) {
      if (send.disabled || id === currentId && thread.querySelector(".msg")) return;
      const response = await fetch(origin + "/chats/" + id);
      if (!response.ok) return;
      const chat = await response.json();
      currentId = id;
      localStorage.setItem(openKey, id);
      turns = chat.messages || [];
      currentTitle = chat.title && chat.title !== "新的对话" ? chat.title : "";
      currentNote = chat.note || "";
      thread.replaceChildren();
      turns.forEach((item) => addBubble(item.role === "user" ? "mine" : "reply", item.content));
      syncCompile();
      drawChats(window.__chats || []);
      box.focus();
    }

    function showStarter() {
      thread.replaceChildren();
      const node = starter.cloneNode(true);
      node.id = "empty";
      thread.append(node);
      bindStarters(node);
    }

    async function remember() {
      if (!currentId) currentId = newId();
      localStorage.setItem(openKey, currentId);
      const response = await fetch(origin + "/chats/" + currentId, {
        method: "PUT",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({
          messages: turns,
          title: currentTitle,
          note: currentNote,
        }),
      });
      if (!response.ok) return;
      const saved = await response.json();
      currentTitle = saved.title || currentTitle;
      currentNote = saved.note || "";
      const list = (window.__chats || []).filter((item) => item.id !== saved.id);
      list.unshift(saved);
      window.__chats = list;
      drawChats(list);
    }

    function hideMenu() {
      menu.hidden = true;
      menu.dataset.id = "";
      menu.innerHTML = menuHome;
    }

    function syncCompile() {
      compile.hidden = turns.length === 0;
    }

    function closeSheet() {
      sheet.hidden = true;
    }

    async function openBrief() {
      if (!turns.length || send.disabled) return;
      compile.disabled = true;
      try {
        const response = await fetch(origin + "/brief", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({ title: currentTitle, messages: turns, chat: currentId }),
        });
        if (!response.ok) return;
        brief = await response.json();
        briefView = "doc";
        sheet.querySelectorAll("[data-view]").forEach((button) => {
          button.setAttribute("aria-pressed", button.getAttribute("data-view") === "doc" ? "true" : "false");
        });
        drawBrief();
        sheet.hidden = false;
      } finally {
        compile.disabled = false;
      }
    }

    function drawBrief() {
      sheetBody.replaceChildren();
      if (!brief) return;
      sheet.querySelector(".sheet-card").classList.toggle("showing-map", briefView === "map");
      if (briefView === "map") drawMap(brief);
      else drawDoc(brief);
    }

    function drawDoc(data) {
      const title = document.createElement("h2");
      title.textContent = data.title || "这段对话";
      sheetBody.append(title);
      const question = document.createElement("p");
      const line = (data.question || "").replace(/。+$/, "");
      question.textContent = data.entry ? line + "。入口是「" + data.entry + "」。" : data.question;
      sheetBody.append(question);
      addSection("你说过", (data.said || []).slice(1), false);
      addSection("今天做", data.steps, true);
      addSection("先不要", data.avoid, true);
      addSection("停下来", data.stop, true);
      if (data.review) addSection("再看", [data.review], true);
      if (data.situation && data.situation.text) {
        const heading = document.createElement("h3");
        heading.textContent = "形势判断";
        sheetBody.append(heading);
        const body = document.createElement("p");
        body.textContent = data.situation.text;
        sheetBody.append(body);
        const meta = document.createElement("p");
        meta.className = "source";
        const bits = [data.situation.title, data.situation.date, data.situation.source].filter(Boolean);
        meta.textContent = "材料：" + bits.join(" · ") + "。信息种类：形势判断。";
        sheetBody.append(meta);
        if (data.situation.scope) {
          const scope = document.createElement("p");
          scope.className = "source";
          scope.textContent = "适用范围：" + data.situation.scope;
          sheetBody.append(scope);
        }
      }
      if (data.notice) {
        const note = document.createElement("p");
        note.className = "notice";
        note.textContent = data.notice;
        sheetBody.append(note);
      }
    }

    function addSection(name, items, pointed) {
      if (!items || !items.length) return;
      const heading = document.createElement("h3");
      heading.textContent = name;
      sheetBody.append(heading);
      if (!pointed) {
        const list = document.createElement("ul");
        items.forEach((item) => {
          const line = document.createElement("li");
          line.textContent = item;
          list.append(line);
        });
        sheetBody.append(list);
        return;
      }
      const list = document.createElement("ol");
      items.forEach((item) => {
        const line = document.createElement("li");
        line.textContent = item.title;
        if (item.how) {
          const how = document.createElement("span");
          how.className = "how";
          how.textContent = item.how;
          line.append(how);
        }
        if (item.path) {
          const source = document.createElement("span");
          source.className = "source";
          source.textContent = "出处：" + item.path + " · " + (item.chapter || "") + " · " + (item.info || "");
          line.append(source);
        }
        list.append(line);
      });
      sheetBody.append(list);
    }

    const mindColors = ["#3b6fd8", "#2f9e62", "#e0892f", "#d4534e", "#7a5cc4"];

    function clipText(text, limit) {
      const flat = String(text || "").replace(/\s+/g, " ").trim();
      if (flat.length <= limit) return flat;
      return flat.slice(0, limit).replace(/[，,。 ]+$/, "") + "…";
    }

    function drawMap(data) {
      const branches = [];
      pushBranch(branches, "你说过", (data.said || []).slice(1));
      pushBranch(branches, "今天做", (data.steps || []).map((item) => item.title));
      pushBranch(branches, "先不要", (data.avoid || []).map((item) => item.title));
      pushBranch(branches, "停下来", (data.stop || []).map((item) => item.title));
      if (data.review) pushBranch(branches, "再看", [data.review.title || "再看"]);
      if (data.review && data.review.how) {
        const review = branches.find((branch) => branch.name === "再看");
        if (review) review.items = [data.review.how];
      }
      branches.forEach((branch, index) => {
        branch.color = mindColors[index % mindColors.length];
      });
      const left = branches.filter((_, index) => index % 2 === 0);
      const right = branches.filter((_, index) => index % 2 === 1);
      const laidLeft = layoutArms(left);
      const laidRight = layoutArms(right);
      const rootLines = wrapText(clipText(data.question, 36), 9);
      const rootW = 168;
      const rootH = Math.max(64, rootLines.length * 22 + 28);
      const gap = 78;
      const height = Math.max(laidLeft.height, laidRight.height, rootH) + 56;
      const rootX = 28 + laidLeft.width + gap;
      const rootY = (height - rootH) / 2;
      const rightX = rootX + rootW + gap;
      const width = rightX + laidRight.width + 28;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "mind-svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      placeArms(svg, laidLeft, 28, (height - laidLeft.height) / 2, "left", rootX, rootY, rootW, rootH);
      placeArms(svg, laidRight, rightX, (height - laidRight.height) / 2, "right", rootX, rootY, rootW, rootH);
      svg.append(nodeBox(rootX, rootY, rootW, rootH, rootLines, "#1c2430", "#fff", 2));
      sheetBody.append(svg);
    }

    function layoutArms(list) {
      const arms = list.map((branch) => {
        const leaves = branch.items.map((text) => {
          const lines = wrapText(text, 16);
          return { lines, w: 236, h: lines.length * 22 + 18 };
        });
        const leavesH = leaves.reduce((sum, leaf) => sum + leaf.h, 0) + Math.max(0, leaves.length - 1) * 12;
        const nodeW = Math.max(76, branch.name.length * 18 + 28);
        return { ...branch, leaves, leavesH, nodeW, nodeH: 42, h: Math.max(leavesH, 42) };
      });
      let y = 0;
      arms.forEach((arm) => {
        arm.y = y;
        y += arm.h + 32;
      });
      const height = Math.max(80, y - (arms.length ? 32 : 0));
      const width = arms.reduce((max, arm) => Math.max(max, 236 + 72 + arm.nodeW), 0);
      return { arms, height, width };
    }

    function placeArms(svg, laid, x, y, side, rootX, rootY, rootW, rootH) {
      const rootCx = side === "left" ? rootX : rootX + rootW;
      const rootCy = rootY + rootH / 2;
      laid.arms.forEach((arm) => {
        const armY = y + arm.y;
        const nodeY = armY + (arm.h - arm.nodeH) / 2;
        const nodeX = side === "left" ? x + 236 + 72 : x;
        const leafX = side === "left" ? x : nodeX + arm.nodeW + 72;
        svg.append(mindCurve(rootCx, rootCy, side === "left" ? nodeX + arm.nodeW : nodeX, nodeY + arm.nodeH / 2, arm.color, 2.6));
        svg.append(nodeBox(nodeX, nodeY, arm.nodeW, arm.nodeH, [arm.name], arm.color, arm.color + "18", 1.5));
        let leafY = armY + (arm.h - arm.leavesH) / 2;
        arm.leaves.forEach((leaf) => {
          const joint = side === "left" ? leafX + leaf.w : leafX;
          svg.append(mindCurve(side === "left" ? nodeX : nodeX + arm.nodeW, nodeY + arm.nodeH / 2, joint, leafY + leaf.h / 2, arm.color, 1.6));
          svg.append(nodeBox(leafX, leafY, leaf.w, leaf.h, leaf.lines, arm.color, "#fff", 1.5));
          leafY += leaf.h + 12;
        });
      });
    }

    function nodeBox(x, y, w, h, lines, color, fill, strokeWidth) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", h);
      rect.setAttribute("rx", 12);
      rect.setAttribute("fill", fill);
      rect.setAttribute("stroke", color);
      rect.setAttribute("stroke-width", strokeWidth);
      group.append(rect);
      lines.forEach((line, index) => {
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x + w / 2);
        text.setAttribute("y", y + (h - lines.length * 22) / 2 + 16 + index * 22);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#1c2430");
        text.setAttribute("font-size", "14");
        text.setAttribute("font-family", "PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif");
        text.textContent = line;
        group.append(text);
      });
      return group;
    }

    function wrapText(text, size) {
      const flat = String(text || "").replace(/\s+/g, " ").trim();
      if (!flat) return [""];
      const lines = [];
      let rest = flat;
      while (rest.length > size) {
        lines.push(rest.slice(0, size));
        rest = rest.slice(size);
      }
      if (rest) lines.push(rest);
      return lines;
    }

    function pushBranch(branches, name, items) {
      const kept = (items || []).map((item) => String(item || "").replace(/\s+/g, " ").trim()).filter((item) => item);
      if (kept.length) branches.push({ name, items: kept });
    }

    function mindCurve(x1, y1, x2, y2, color, width) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const bend = Math.max(48, Math.abs(x2 - x1) * 0.55);
      const dir = x2 >= x1 ? 1 : -1;
      path.setAttribute("d", "M " + x1 + " " + y1 + " C " + (x1 + bend * dir) + " " + y1 + ", " + (x2 - bend * dir) + " " + y2 + ", " + x2 + " " + y2);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", width);
      path.setAttribute("stroke-linecap", "round");
      return path;
    }


    async function removeChat(id) {
      const response = await fetch(origin + "/chats/" + id, { method: "DELETE" });
      if (!response.ok && response.status !== 404) return;
      window.__chats = (window.__chats || []).filter((item) => item.id !== id);
      if (currentId === id) beginNew();
      else drawChats(window.__chats);
    }

    function openMenu(x, y, id) {
      menu.innerHTML = menuHome;
      menu.dataset.id = id;
      menu.hidden = false;
      menu.style.left = "0px";
      menu.style.top = "0px";
      const width = menu.offsetWidth;
      const height = menu.offsetHeight;
      const left = Math.min(x, window.innerWidth - width - 8);
      const top = Math.min(y, window.innerHeight - height - 8);
      menu.style.left = Math.max(8, left) + "px";
      menu.style.top = Math.max(8, top) + "px";
    }

    function editChat(id, act) {
      const button = chats.querySelector(`[data-id="${id}"]`);
      if (!button) return;
      const item = (window.__chats || []).find((chat) => chat.id === id) || {};
      const isName = act === "rename";
      let span = button.querySelector(isName ? ".chat-name" : ".chat-note");
      if (!span) {
        span = document.createElement("span");
        span.className = "chat-note";
        button.append(span);
      }
      const input = document.createElement("input");
      input.maxLength = isName ? 32 : 80;
      input.value = isName ? span.textContent : item.note || "";
      input.placeholder = isName ? "对话名字" : "一句备注";
      span.replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const finish = async () => {
        if (done) return;
        done = true;
        const value = input.value.trim();
        if (id === currentId) {
          if (isName) currentTitle = value;
          else currentNote = value;
        }
        const response = await fetch(origin + "/chats/" + id);
        if (!response.ok) return;
        const chat = await response.json();
        const body = {
          messages: chat.messages || [],
          title: isName ? value : chat.title,
          note: isName ? chat.note || "" : value,
        };
        const savedResponse = await fetch(origin + "/chats/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify(body),
        });
        if (!savedResponse.ok) return;
        const saved = await savedResponse.json();
        const list = (window.__chats || []).filter((chatItem) => chatItem.id !== id);
        list.unshift(saved);
        list.sort((a, b) => (a.updated < b.updated ? 1 : -1));
        window.__chats = list;
        if (id === currentId) {
          currentTitle = saved.title || "";
          currentNote = saved.note || "";
        }
        drawChats(list);
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          finish();
        }
        if (event.key === "Escape") {
          done = true;
          drawChats(window.__chats || []);
        }
      });
      input.addEventListener("blur", () => finish());
      input.addEventListener("click", (event) => event.stopPropagation());
    }

    function newId() {
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    async function ask(text) {
      const node = document.querySelector("#empty");
      if (node) node.remove();
      addBubble("mine", text);
      const bubble = addBubble("reply", "");
      const caret = document.createElement("span");
      caret.className = "caret";
      bubble.append(caret);
      send.disabled = true;
      if (!currentId) currentId = newId();
      localStorage.setItem(openKey, currentId);
      const earlier = turns.slice();
      const typer = pace(bubble, caret);
      let spoken = "";
      let buffer = "";
      try {
        const response = await fetch(origin + "/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({ text, earlier, chat: currentId }),
        });
        if (!response.ok || !response.body) {
          bubble.textContent = "这句话没送出去。我再试一次。";
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const step = await reader.read();
          if (step.done) break;
          buffer += decoder.decode(step.value, { stream: true });
          buffer = takeEvents(buffer, (piece) => {
            spoken += piece;
            typer.push(piece);
          });
        }
        buffer += decoder.decode();
        takeEvents(buffer + "\n\n", (piece) => {
          spoken += piece;
          typer.push(piece);
        });
        await typer.finish();
        if (!spoken.trim()) bubble.textContent = "我再换一种说法问一次。";
        turns.push({ role: "user", content: text });
        turns.push({ role: "assistant", content: spoken.trim() || bubble.textContent });
        await remember();
        syncCompile();
      } catch (error) {
        bubble.textContent = "我这边还没连上。先确认这一页已经在本机打开。";
      } finally {
        caret.remove();
        send.disabled = false;
        box.focus();
        followThread(true);
      }
    }

    function addBubble(kind, text) {
      const row = document.createElement("div");
      row.className = "msg " + kind;
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      row.append(paragraph);
      thread.append(row);
      followThread(true);
      return paragraph;
    }

    function pace(bubble, caret) {
      let queue = "";
      let timer = null;
      let finished = false;
      let resolveDone = null;
      const step = 42;

      function pump() {
        if (!queue) {
          timer = null;
          if (finished && resolveDone) resolveDone();
          return;
        }
        bubble.insertBefore(document.createTextNode(queue[0]), caret);
        queue = queue.slice(1);
        followThread();
        timer = setTimeout(pump, step);
      }

      return {
        push(text) {
          queue += text;
          if (!timer) pump();
        },
        finish() {
          finished = true;
          if (!timer) return Promise.resolve();
          return new Promise((resolve) => {
            resolveDone = resolve;
          });
        },
      };
    }

    function followThread(force) {
      const room = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
      if (force || room < 96) thread.scrollTop = thread.scrollHeight;
    }

    function takeEvents(buffer, onToken) {
      let split = buffer.indexOf("\n\n");
      while (split >= 0) {
        const text = eventText(buffer.slice(0, split));
        if (text.event === "token" && text.data) onToken(text.data);
        buffer = buffer.slice(split + 2);
        split = buffer.indexOf("\n\n");
      }
      return buffer;
    }

    function eventText(block) {
      let event = "message";
      const data = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data.push(line.slice(6));
      });
      return { event, data: data.join("\n") };
    }
