<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我想听一句今天能做的话</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      background: #f3f5f8;
      color: #1c2430;
      font: 16px/1.55 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    .side {
      width: 240px;
      flex: none;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #e6eaf0;
    }
    .new {
      margin: 0.85rem 0.75rem 0.45rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid #e1e6ee;
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .new:hover { background: #f6f8fb; }
    .chats {
      flex: 1;
      overflow-y: auto;
      padding: 0.2rem 0.45rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 36, 48, 0.22) transparent;
    }
    .chats::-webkit-scrollbar, .thread::-webkit-scrollbar { width: 8px; }
    .chats::-webkit-scrollbar-track, .thread::-webkit-scrollbar-track { background: transparent; }
    .chats::-webkit-scrollbar-thumb, .thread::-webkit-scrollbar-thumb {
      background: rgba(28, 36, 48, 0.18);
      border: 2px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }
    .chats button {
      display: block;
      width: 100%;
      margin: 0.15rem 0;
      padding: 0.55rem 0.65rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .chats button:hover { background: #f4f6f9; }
    .chats button.active { background: #e8edf4; }
    .app {
      flex: 1;
      min-width: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header { padding: 1.1rem 1.15rem 0.35rem; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -0.02em; }
    header p { margin: 0.25rem 0 0; color: #5c6778; font-size: 0.92rem; }
    .thread {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0.6rem 0.7rem 0.4rem 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(28, 36, 48, 0.22) transparent;
    }
    .empty {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.45rem;
      padding-bottom: 0.4rem;
    }
    .empty p { margin: 0 0 0.2rem; color: #5c6778; }
    .empty button, .composer button, .new { font: inherit; cursor: pointer; }
    .empty button {
      align-self: flex-start;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #1c2430;
      padding: 0.45rem 0.8rem;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.06);
    }
    .msg { display: flex; margin: 1.05rem 0; }
    .msg.mine { justify-content: flex-end; }
    .msg p {
      margin: 0;
      max-width: 82%;
      padding: 0.65rem 0.8rem;
      border-radius: 16px;
      white-space: pre-wrap;
    }
    .msg.mine p { background: #1c2430; color: #fff; border-bottom-right-radius: 5px; }
    .msg.reply p { background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(28, 36, 48, 0.05); }
    .composer {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      padding: 0.55rem 0.85rem 0.9rem;
    }
    textarea {
      flex: 1;
      margin: 0;
      min-height: 2.75rem;
      max-height: 7.5rem;
      padding: 0.7rem 0.85rem;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      font: inherit;
      resize: none;
      box-shadow: 0 1px 2px rgba(28, 36, 48, 0.06);
    }
    textarea:focus { outline: 2px solid #1c2430; outline-offset: 0; }
    .composer button {
      height: 2.75rem;
      padding: 0 0.95rem;
      border: 0;
      border-radius: 999px;
      background: #1c2430;
      color: #fff;
    }
    .composer button:disabled { background: #8b95a3; cursor: progress; }
    .caret {
      display: inline-block;
      width: 0.45em;
      height: 0.95em;
      margin-left: 0.08em;
      background: #1c2430;
      vertical-align: text-bottom;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <aside class="side">
    <button class="new" type="button" id="new-chat">新对话</button>
    <div class="chats" id="chats"></div>
  </aside>
  <div class="app">
    <header>
      <h1>我想听一句今天能做的话</h1>
      <p>我说卡在哪，你接着告诉我今天能做什么。</p>
    </header>
    <div class="thread" id="thread">
      <div class="empty" id="empty">
        <p>我可以这样开口</p>
        <button type="button" data-fill="我不知道从哪开始，只想重新动一下。今天大概有半小时。">我不知道从哪开始</button>
        <button type="button" data-fill="我只想练英语听力。今天有四十分钟。">我只想练听力</button>
        <button type="button" data-fill="我今天只有几分钟，想要一个很短的动作。">我今天很短</button>
        <button type="button" data-fill="我有一个想法，但还没有人用。今天有四十分钟。">我有想法，还没人用</button>
      </div>
    </div>
    <form class="composer" id="ask" method="get" action="/">
      <textarea id="text" rows="1" placeholder="接着说，或换一件卡着的事"></textarea>
      <button type="button" class="send">发送</button>
    </form>
    <!-- result -->
  </div>
  <script>
    const thread = document.querySelector("#thread");
    const chats = document.querySelector("#chats");
    const starter = document.querySelector("#empty");
    const box = document.querySelector("#text");
    const send = document.querySelector(".send");
    const form = document.querySelector("#ask");
    const origin = location.protocol === "file:" ? "http://127.0.0.1:8765" : "";
    const openKey = "planner-open";
    let turns = [];
    let currentId = localStorage.getItem(openKey) || "";

    document.querySelector("#new-chat").addEventListener("click", () => beginNew());
    form.addEventListener("submit", (event) => event.preventDefault());
    send.addEventListener("click", () => sendText(box.value));
    box.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendText(box.value);
      }
    });
    box.addEventListener("input", () => {
      box.style.height = "auto";
      box.style.height = Math.min(box.scrollHeight, 120) + "px";
    });
    bindStarters(starter);
    loadChats();

    function bindStarters(root) {
      root.querySelectorAll("[data-fill]").forEach((button) => {
        button.addEventListener("click", () => sendText(button.getAttribute("data-fill")));
      });
    }

    function sendText(raw) {
      const text = (raw || "").trim();
      if (!text || send.disabled) return;
      box.value = "";
      box.style.height = "auto";
      ask(text);
    }

    function beginNew() {
      if (send.disabled) return;
      currentId = "";
      localStorage.removeItem(openKey);
      turns = [];
      showStarter();
      drawChats(window.__chats || []);
      box.focus();
    }

    async function loadChats() {
      try {
        const response = await fetch(origin + "/chats");
        const list = response.ok ? await response.json() : [];
        window.__chats = list;
        drawChats(list);
        if (currentId && list.some((item) => item.id === currentId)) openChat(currentId);
        else beginNew();
      } catch (error) {
        beginNew();
      }
    }

    function drawChats(list) {
      chats.replaceChildren();
      list.forEach((item) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.title || "新的对话";
        if (item.id === currentId) button.className = "active";
        button.addEventListener("click", () => openChat(item.id));
        chats.append(button);
      });
    }

    async function openChat(id) {
      if (send.disabled || id === currentId && thread.querySelector(".msg")) return;
      const response = await fetch(origin + "/chats/" + id);
      if (!response.ok) return;
      const chat = await response.json();
      currentId = id;
      localStorage.setItem(openKey, id);
      turns = chat.messages || [];
      thread.replaceChildren();
      turns.forEach((item) => addBubble(item.role === "user" ? "mine" : "reply", item.content));
      drawChats(window.__chats || []);
      box.focus();
    }

    function showStarter() {
      thread.replaceChildren();
      const node = starter.cloneNode(true);
      node.id = "empty";
      thread.append(node);
      bindStarters(node);
    }

    async function remember() {
      if (!currentId) currentId = newId();
      localStorage.setItem(openKey, currentId);
      const response = await fetch(origin + "/chats/" + currentId, {
        method: "PUT",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({ messages: turns }),
      });
      if (!response.ok) return;
      const saved = await response.json();
      const list = (window.__chats || []).filter((item) => item.id !== saved.id);
      list.unshift(saved);
      window.__chats = list;
      drawChats(list);
    }

    function newId() {
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    async function ask(text) {
      const node = document.querySelector("#empty");
      if (node) node.remove();
      addBubble("mine", text);
      const bubble = addBubble("reply", "");
      const caret = document.createElement("span");
      caret.className = "caret";
      bubble.append(caret);
      send.disabled = true;
      const earlier = turns.slice();
      const typer = pace(bubble, caret);
      let spoken = "";
      let buffer = "";
      try {
        const response = await fetch(origin + "/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=utf-8" },
          body: JSON.stringify({ text, earlier }),
        });
        if (!response.ok || !response.body) {
          bubble.textContent = "这句话没送出去。我再试一次。";
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const step = await reader.read();
          if (step.done) break;
          buffer += decoder.decode(step.value, { stream: true });
          buffer = takeEvents(buffer, (piece) => {
            spoken += piece;
            typer.push(piece);
          });
        }
        buffer += decoder.decode();
        takeEvents(buffer + "\n\n", (piece) => {
          spoken += piece;
          typer.push(piece);
        });
        await typer.finish();
        if (!spoken.trim()) bubble.textContent = "我再换一种说法问一次。";
        turns.push({ role: "user", content: text });
        turns.push({ role: "assistant", content: spoken.trim() || bubble.textContent });
        await remember();
      } catch (error) {
        bubble.textContent = "我这边还没连上。先确认这一页已经在本机打开。";
      } finally {
        caret.remove();
        send.disabled = false;
        box.focus();
        followThread(true);
      }
    }

    function addBubble(kind, text) {
      const row = document.createElement("div");
      row.className = "msg " + kind;
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      row.append(paragraph);
      thread.append(row);
      followThread(true);
      return paragraph;
    }

    function pace(bubble, caret) {
      let queue = "";
      let timer = null;
      let finished = false;
      let resolveDone = null;
      const step = 42;

      function pump() {
        if (!queue) {
          timer = null;
          if (finished && resolveDone) resolveDone();
          return;
        }
        bubble.insertBefore(document.createTextNode(queue[0]), caret);
        queue = queue.slice(1);
        followThread();
        timer = setTimeout(pump, step);
      }

      return {
        push(text) {
          queue += text;
          if (!timer) pump();
        },
        finish() {
          finished = true;
          if (!timer) return Promise.resolve();
          return new Promise((resolve) => {
            resolveDone = resolve;
          });
        },
      };
    }

    function followThread(force) {
      const room = thread.scrollHeight - thread.scrollTop - thread.clientHeight;
      if (force || room < 96) thread.scrollTop = thread.scrollHeight;
    }

    function takeEvents(buffer, onToken) {
      let split = buffer.indexOf("\n\n");
      while (split >= 0) {
        const text = eventText(buffer.slice(0, split));
        if (text.event === "token" && text.data) onToken(text.data);
        buffer = buffer.slice(split + 2);
        split = buffer.indexOf("\n\n");
      }
      return buffer;
    }

    function eventText(block) {
      let event = "message";
      const data = [];
      block.split("\n").forEach((line) => {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data.push(line.slice(6));
      });
      return { event, data: data.join("\n") };
    }
  </script>
</body>
</html>
